[project]
name = "municipal-service-delivery-bi"
version = "0.1.0"
description = "Data pipeline for the Water and Sanitation operations dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
